# server-env Secret은 git에 커밋하지 않는다 — `kubectl create secret`으로 직접 생성.
# 필요한 키는 이 저장소 README의 "server 필수 환경변수" 표 참고 (server의 application.yaml 기준으로 정리됨).
#
# enableServiceLinks: false 필수 — Service 이름이 "server"라서 k8s가 자동 주입하는
# SERVER_PORT(예: tcp://10.43.x.x:8080)가 Spring Boot의 server.port 프로퍼티랑
# 이름이 충돌해서 부팅 자체가 실패한다 (2026-08-06 실제로 겪음). 다른 서비스도 예방 차원에서 동일하게 끔.
#
# /app/data PVC + fsGroup: 10001 필수 — FILE_STORAGE_LOCAL_PATH(=/app/data/files)와
# 데모 시드가 쓰는 파일을 저장할 쓰기 가능한 볼륨이 없으면 non-root UID 10001(Dockerfile 기준)이
# /app/data에 쓰다가 AccessDeniedException으로 부팅이 실패한다 (2026-08-10 실제로 겪음).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: server-data
  namespace: fowoco
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
  namespace: fowoco
spec:
  replicas: 1
  selector:
    matchLabels:
      app: server
  template:
    metadata:
      labels:
        app: server
    spec:
      enableServiceLinks: false
      securityContext:
        fsGroup: 10001
      containers:
        - name: server
          image: ghcr.io/fowoco/server:latest
          envFrom:
            - secretRef:
                name: server-env
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 300m
              memory: 512Mi
            limits:
              cpu: 800m
              memory: 1024Mi
          volumeMounts:
            - name: data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: server-data
---
apiVersion: v1
kind: Service
metadata:
  name: server
  namespace: fowoco
spec:
  selector:
    app: server
  ports:
    - port: 8080
      targetPort: 8080
