# server-env Secret은 git에 커밋하지 않는다 — `kubectl create secret`으로 직접 생성.
# 필요한 키는 이 저장소 README의 "server 필수 환경변수" 표 참고 (server의 application.yaml 기준으로 정리됨).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
  namespace: fowoco
spec:
  replicas: 1
  selector:
    matchLabels:
      app: server
  template:
    metadata:
      labels:
        app: server
    spec:
      containers:
        - name: server
          image: ghcr.io/fowoco/server:latest
          envFrom:
            - secretRef:
                name: server-env
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: server
  namespace: fowoco
spec:
  selector:
    app: server
  ports:
    - port: 8080
      targetPort: 8080
