# host는 nip.io 무료 와일드카드 DNS 사용 (실제 배포 시 EC2 퍼블릭 IP로 교체).
# 예: fowoco.3.35.105.80.nip.io — 도메인 구매 전까지 이걸로 데모 가능.
#
# cert-manager.io/cluster-issuer 애노테이션이 있으면 cert-manager의 ingress-shim이
# 이 host 기준으로 Certificate를 자동 생성하고, 발급되면 tls.secretName에 채워 넣는다.
# ClusterIssuer 정의는 06-cert-manager-issuer.yaml 참고 (cert-manager 자체는 helm으로 별도 설치).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fowoco
  namespace: fowoco
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - fowoco.3.35.105.80.nip.io
      secretName: fowoco-tls
  rules:
    - host: fowoco.3.35.105.80.nip.io
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: server
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: client
                port:
                  number: 80
