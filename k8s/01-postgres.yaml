# Postgres는 클러스터 안에 컨테이너로 직접 운영한다 (심사 데모 규모라 매니지드 DB 불필요).
# POSTGRES_PASSWORD는 실제 값으로 별도 관리 — 이 파일은 예시이며 진짜 배포 시 postgres-secret은
# `kubectl create secret` 명령으로 직접 생성하고 이 파일에서는 제외할 것 (git에 평문 커밋 금지).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: fowoco
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      enableServiceLinks: false
      containers:
        - name: postgres
          image: postgres:16-alpine
          envFrom:
            - secretRef:
                name: postgres-secret
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "fowoco"]
            initialDelaySeconds: 5
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: fowoco
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
