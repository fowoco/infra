# Intent 모델·CLOVA OCR·Server↔AI Internal Bearer를 실제로 켜면서 ai-env Secret이 필요해짐.
# ai-env는 git에 커밋하지 않는다 — `kubectl create secret`으로 직접 생성.
# 필요한 키는 ai 저장소 .env.example 참고 (FOWOCO_ 접두사, app/core/config.py 기준).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai
  namespace: fowoco
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai
  template:
    metadata:
      labels:
        app: ai
    spec:
      enableServiceLinks: false
      containers:
        - name: ai
          image: ghcr.io/fowoco/ai:latest
          envFrom:
            - secretRef:
                name: ai-env
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 2048Mi
          readinessProbe:
            httpGet:
              path: /docs
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /docs
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ai
  namespace: fowoco
spec:
  selector:
    app: ai
  ports:
    - port: 8000
      targetPort: 8000
