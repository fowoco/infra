# ai는 필수 환경변수가 없다 (전부 기본값 존재, app/core/config.py 기준).
# 외부에 노출하지 않고 클러스터 내부에서만 server가 호출한다 (ClusterIP, Ingress 경로 없음).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai
  namespace: fowoco
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai
  template:
    metadata:
      labels:
        app: ai
    spec:
      containers:
        - name: ai
          image: ghcr.io/fowoco/ai:latest
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /docs
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ai
  namespace: fowoco
spec:
  selector:
    app: ai
  ports:
    - port: 8000
      targetPort: 8000
