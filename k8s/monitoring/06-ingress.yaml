# fowoco 앱과 같은 nip.io 무료 와일드카드 DNS를 쓰되 서브도메인만 분리
# (grafana.<EC2 퍼블릭 IP>.nip.io) — 새 DNS 등록 없이 바로 붙는다.
# ClusterIssuer(letsencrypt-prod)는 ../06-cert-manager-issuer.yaml에서 이미 만들어져 있어 재사용.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: monitoring
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - grafana.3.35.105.80.nip.io
      secretName: grafana-tls
  rules:
    - host: grafana.3.35.105.80.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000
