# kubernetes-nodes-cadvisor/kubernetes-apiserver 두 job은 kubelet에 직접 붙지 않고
# API 서버(kubernetes.default.svc:443)를 거치는 표준 proxy 패턴을 쓴다 — kubelet의 서빙
# 인증서는 보통 클러스터 CA로 검증이 안 되는데, API 서버 인증서는 ca.crt로 검증되고
# 01-rbac.yaml의 nodes/proxy·비-리소스 /metrics 권한이 정확히 이 경로용이라 그렇다.
#
# fowoco-server job의 basic_auth 비밀번호는 prometheus-scrape-auth Secret에서 파일로
# 마운트한다 (Prometheus는 prometheus.yml 안에서 환경변수 치환을 지원하지 않음).
# Secret은 grafana-admin과 동일하게 git에 커밋하지 않고 kubectl로 직접 생성하며,
# server의 server-env PROMETHEUS_SCRAPE_PASSWORD와 같은 값이어야 한다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: kubernetes-apiserver
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        static_configs:
          - targets: ["kubernetes.default.svc:443"]

      - job_name: kubernetes-nodes-cadvisor
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor

      - job_name: node-exporter
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: [monitoring]
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: node-exporter
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: metrics

      - job_name: kube-state-metrics
        static_configs:
          - targets: ["kube-state-metrics.monitoring.svc.cluster.local:8080"]

      - job_name: fowoco-server
        metrics_path: /actuator/prometheus
        basic_auth:
          username: prometheus
          password_file: /etc/prometheus-scrape-auth/password
        static_configs:
          - targets: ["server.fowoco.svc.cluster.local:8080"]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: monitoring
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
spec:
  replicas: 1
  strategy:
    # local-path PVC는 ReadWriteOnce라 RollingUpdate로 새/구 파드가 잠깐 겹치면
    # 새 파드가 PVC를 못 붙잡고 Pending에 걸린다 — 단일 노드에선 항상 Recreate.
    type: Recreate
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      enableServiceLinks: false
      serviceAccountName: prometheus
      # prom/prometheus 이미지는 UID 65534(nobody)로 뜬다 — PVC에 쓰기 권한이 없으면
      # server의 fsGroup 10001 케이스와 똑같이 AccessDeniedException으로 죽는다.
      securityContext:
        fsGroup: 65534
      containers:
        - name: prometheus
          image: prom/prometheus:v3.13.2
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=10d
            - --web.enable-lifecycle
          ports:
            - containerPort: 9090
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
            - name: scrape-auth
              mountPath: /etc/prometheus-scrape-auth
              readOnly: true
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 5
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          persistentVolumeClaim:
            claimName: prometheus-data
        - name: scrape-auth
          secret:
            secretName: prometheus-scrape-auth
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
