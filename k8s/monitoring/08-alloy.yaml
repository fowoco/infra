# 원래 Promtail(hostPath로 /var/log/pods 직접 tail)을 썼는데, Promtail의 role: pod
# 쿠버네티스 서비스 디스커버리가 이 클러스터에서 "Starting provider" 로그 이후로
# 완전히 멈추는 재현 가능한 문제가 있었음(RBAC·API 접근·글롭 패턴 전부 정상 확인,
# Prometheus 자체 kubernetes_sd는 같은 클러스터에서 멀쩡히 동작 — Promtail 쪽
# 디스커버리 구현 자체의 문제로 판단). Promtail은 Grafana가 유지보수 모드로 전환한
# 프로젝트라 공식 후속인 Alloy로 교체 — Alloy는 Prometheus 업스트림 discovery
# 패키지를 그대로 재사용해서 이 문제를 겪지 않을 가능성이 높음.
#
# 게다가 Alloy의 loki.source.kubernetes 컴포넌트는 호스트 파일시스템을 hostPath로
# 직접 읽지 않고 Kubernetes API(pods/log)로 로그를 스트리밍해서 가져옴 — 컨테이너
# 런타임의 로그 파일 배치(containerd vs docker)에 의존하지 않아 더 이식성이 좋고,
# 노드마다 뜰 필요도 없어서 DaemonSet 대신 단일 Deployment로 충분함.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: alloy
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: alloy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: alloy
subjects:
  - kind: ServiceAccount
    name: alloy
    namespace: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
  namespace: monitoring
data:
  config.alloy: |
    discovery.kubernetes "pods" {
      role = "pod"
    }

    discovery.relabel "pods" {
      targets = discovery.kubernetes.pods.targets

      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }
    }

    loki.source.kubernetes "pods" {
      targets    = discovery.relabel.pods.output
      forward_to = [loki.write.default.receiver]
    }

    loki.write "default" {
      endpoint {
        url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alloy
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alloy
  template:
    metadata:
      labels:
        app: alloy
    spec:
      serviceAccountName: alloy
      enableServiceLinks: false
      containers:
        - name: alloy
          image: grafana/alloy:v1.18.1
          args:
            - run
            - /etc/alloy/config.alloy
            - --storage.path=/var/lib/alloy/data
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
      volumes:
        - name: config
          configMap:
            name: alloy-config
